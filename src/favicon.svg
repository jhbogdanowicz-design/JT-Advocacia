<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .fav-j {
      font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
      font-size: 82px;
      font-weight: 700;
      fill: #C5A880; /* Elegant gold */
    }
    .fav-t {
      font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
      font-size: 82px;
      font-weight: 700;
      fill: #0A192F; /* Deep navy */
    }
  </style>
  <!-- Beautiful centered JT monogram -->
  <g>
    <text x="12" y="80" class="fav-j">J</text>
    <text x="44" y="80" class="fav-t">T</text>
  </g>
